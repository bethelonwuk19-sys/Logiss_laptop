name: Build Android APK

# Runs whenever you push to main, or you can trigger it manually from
# the "Actions" tab on GitHub with the "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Build APK on Expo's servers
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait --json > build-output.json

      - name: Download the finished APK
        run: |
          URL=$(node -e "const d=require('./build-output.json'); const b=Array.isArray(d)?d[0]:d; console.log(b.artifacts.buildUrl)")
          echo "Downloading from $URL"
          curl -L "$URL" -o app-build.apk

      - name: Attach the APK to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: logiss-field-apk
          path: ./app-build.apk
